services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dayline
      POSTGRES_PASSWORD: dayline
      POSTGRES_DB: dayline
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dayline -d dayline']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
